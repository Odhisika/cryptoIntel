{% for asset in results %}
<a href="{% url 'core:asset-detail' asset_id=asset.id %}" class="flex items-center gap-3 px-4 py-2.5 hover:bg-gray-700 transition border-b border-gray-700/50 last:border-0">
  <div>
    <div class="text-sm font-medium text-white">{{ asset.symbol|upper }}</div>
    <div class="text-xs text-gray-400">{{ asset.name|truncatechars:30 }}</div>
  </div>
  <div class="ml-auto">
    {% if asset.sector %}
    <span class="text-xs text-gray-500">{{ asset.sector }}</span>
    {% endif %}
  </div>
</a>
{% empty %}
<div class="px-4 py-3 text-sm text-gray-500">No results found</div>
{% endfor %}
